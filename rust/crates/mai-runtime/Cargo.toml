[package]
name = "mai-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "MAI native async agent execution runtime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.33"
chrono = { version = "0.4", default-features = true }
rust_decimal = "1"
walkdir = "2"
globset = "0.4"
regex = "1"
tempfile = "3"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util", "net", "io-util"] }
