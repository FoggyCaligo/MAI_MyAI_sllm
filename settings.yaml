# dev2: 포터블 단일 모델 전용. 엔진은 llama.cpp 하나이며 모델은 하나만 선택한다.
# MODEL_GGUF_PATH는 실제 GGUF 모델 파일 경로다. llama.cpp 내부 alias는 mai-model로 고정.
# 일반 환경변수와 .env가 이 파일보다 우선한다.
MODEL_GGUF_PATH: "portable/portable-models/gguf/active.gguf"
# Optional separate vision model; leave blank by omitting both keys to disable.
# VISION_GGUF_PATH: "portable/portable-models/gguf/vision.gguf"
# VISION_MMPROJ_PATH: "portable/portable-models/gguf/mmproj.gguf"
# Optional compact verifier (e.g., LFM GGUF); disabled by default.
# VERIFIER_GGUF_PATH: "portable/portable-models/gguf/lfm2.5-2.6b.gguf"
LLAMACPP_HOST: "http://127.0.0.1:8080"
MAI_MODEL_REQUEST_TIMEOUT_SECONDS: 500

AGENT_MAX_IDENTICAL_CALLS: 3
AGENT_MAX_IDENTICAL_FAILURES: 2
AGENT_MAX_NO_PROGRESS_ROUNDS: 2
MAX_INLINE_TOOL_RESULT_CHARS: 8000
SESSION_HISTORY_MESSAGES: 10
MAI_ANSWER_QUALITY_REVIEW: false
# false: skip ALL final verifier requests (numeric and factual); no verifier KV switching.
MAI_VERIFIER_ENABLED: true
# critical: only demonstrated contradictions, false completion or essential misalignment block.
# strict: preserve prior rejection behavior.
MAI_VERIFIER_BLOCKING_MODE: critical

VOICE_SILENCE_SECONDS: 5
VOICE_MATCH_THRESHOLD: 0.65
VOICE_WHISPER_MODEL: small

# 원격 웹 호스팅 선택: none / tailscale / cloudflare. 비밀 토큰은 .env에만 저장.
REMOTE_HOSTING_PROVIDER: tailscale
