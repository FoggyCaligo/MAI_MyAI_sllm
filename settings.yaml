# MAI 공개 기본 설정. 비밀번호나 토큰을 저장하지 않는다.
# 우선순위: 기존 환경변수 > .env > 이 파일.
# 선택한 백엔드 주소와 모델은 실제 실행 가능한 값이어야 한다.
# 비전은 설정된 메인 GGUF와 호환 가능한 projector를 통해 직접 입력한다.
# 시간·출력·반복·문맥·음성 관련 항목은 기본값으로 사용할 수 있다.
# 값이 로드되어도 실행에서 사용되지 않는 항목은 docs/architecture.md를 참고한다.
# 음성 패키지·마이크·브라우저 권한과 GPU 환경은 별도 준비한다.
LLM_BACKEND: llamacpp
LLAMACPP_HOST: "http://127.0.0.1:8080"
# llama.cpp 전용: 폴더 내 GGUF를 시작 시 자동 탐색. MAIN_GGUF_PATH는 기본 선택값.
# 경로는 프로젝트 루트 상대경로 또는 절대경로.
LLAMACPP_GGUF_DIRECTORY: "portable/portable-models/gguf"  # 실행 시작 시 모델 목록 자동 탐색
LLAMACPP_MAIN_GGUF_PATH: "portable/portable-models/gguf/Ornith-1.5-9B-Q4_K_M.gguf"
# UI 선택 GGUF는 Main·Verifier·기억 추출에 공통 적용된다.
# 비전 지원 메인 모델에서 별도 projector를 사용하는 경우 주석 해제:
LLAMACPP_MAIN_MMPROJ_PATH: "portable/portable-models/gguf/mmproj-Ornith-1.5-9B-BF16.gguf"
# 메인 Ornith 1.5에 이미지를 직접 전달 (실제 추론은 호스트의 llama.cpp에서 검증 필요).
LLAMACPP_MAIN_VISION: true
# 양자화 이름이 다른 모델·projector 쌍은 파일명 추측 없이 명시적으로 연결.
LLAMACPP_MODEL_MMPROJ_MAP: '{"gemma-4-E4B-it-Q4_K_M.gguf":"mmproj-gemma-4-E4B-it-BF16.gguf"}'
# llama.cpp router와 자식 모델에 적용. 모델 버전을 교체해도 유지되는 런타임 설정.
# 과거 추론의 보존만 끔. 현재 요청의 thinking 자체는 비활성화하지 않음.
LLAMACPP_REASONING_PRESERVE: false
# 별도 RAM 프롬프트 캐시(MiB). 0: 비활성화, 활성 추론 KV 캐시와 모델 상주는 유지.
LLAMACPP_CACHE_RAM_MIB: 0
# 공통 메모리 보호 게이트웨이. true: MAI/OpenClaw 등 8080을 쓰는 모든 클라이언트에 적용.
# false: 게이트웨이 없이 기존 llama.cpp Router를 8080에 직접 노출 (재시작 필요).
LLAMACPP_MEMORY_GUARD_ENABLED: true
# 모델 로딩 전 남겨 둘 최소 VRAM(MiB). llama.cpp의 GPU 메모리 추정치 기준.
# 측정 결과는 스냅샷이며 하드웨어 수준의 할당 상한이 아니다.
LLAMACPP_MIN_FREE_VRAM_MIB: 1024
# 새 모델 작업 시작 전 확보되어야 할 시스템 가용 RAM(MiB).
MAI_MIN_AVAILABLE_RAM_MIB: 6144
# 모델 컨텍스트 상한(토큰). 모델 로딩 시 KV 캐시 메모리에 반영된다.
LLAMACPP_CONTEXT_SIZE: 65536
# 별도 Vision GGUF를 사용하는 경우에만 주석 해제:
# LLAMACPP_VISION_GGUF_PATH: "portable/portable-models/gguf/mmproj-Ornith-1.5-9B-BF16.gguf"
# LLAMACPP_VISION_MMPROJ_PATH: "portable/portable-models/gguf/vision-mmproj.gguf"


MODEL_REQUEST_TIMEOUT_SECONDS: 500
MODEL_MAX_OUTPUT_TOKENS: 32768
MAI_DEBUG_MODEL_INPUT: false

## 규칙 기반 재사용 및 진행 요약 (추가 LLM 호출 없음)
AGENT_EVIDENCE_REUSE_ENABLED: false
AGENT_PROGRESS_SUMMARY_ENABLED: true
# 스트리밍 thinking 반복 확정 시 현재 모델 호출만 중지하고 새 턴에서 복구 (긴 추론은 경고만)
AGENT_REASONING_MONITOR_ENABLED: true
AGENT_MAX_IDENTICAL_CALLS: 3
AGENT_MAX_IDENTICAL_FAILURES: 2
AGENT_MAX_NO_PROGRESS_ROUNDS: 2
TOOL_TIMEOUT_SECONDS: 60
MAX_INLINE_TOOL_RESULT_CHARS: 8000
MEMORY_RECALL_INCLUDE_UTTERANCES: false
SESSION_HISTORY_MESSAGES: 16
MAI_VERIFIER_ENABLED: false  # UI와 서버의 요청별 검증 기본값
MAI_ANSWER_QUALITY_REVIEW: false
# strict: 기존 모든 검증 이슈를 차단. critical: 입증된 중대한 오류 위주로 차단.
MAI_VERIFIER_BLOCKING_MODE: critical

VOICE_SILENCE_SECONDS: 5
VOICE_WHISPER_MODEL: small
# 음성 인식: local(Whisper + Silero VAD) / web_speech(브라우저 인식)
VOICE_STT_PROVIDER: local

# 원격 웹 호스팅 선택: none / tailscale / cloudflare. 비밀 토큰은 .env에만 저장.
REMOTE_HOSTING_PROVIDER: tailscale
