# MAI settings (non-secret). Never store passwords or tokens here.
# Existing .env / process environment values override these defaults.
#
# [Required operation settings] A valid value is needed to connect to the
# selected model backend and run the main agent. Values can change, but must
# describe an available backend/model endpoint; this does NOT mean each
# individual key is mandatory to type because the file supplies defaults.
LLM_BACKEND: ollama
LLAMACPP_HOST: "http://127.0.0.1:8080"  # required only when using llama.cpp
OLLAMA_HOST: "http://127.0.0.1:11434"  # required only when using Ollama
MAIN_MODEL: "ornith-1.5:9b"  # must match an available model
# Optional image tool: when unavailable, image_analyze is not registered.
VISION_MODEL: "gemma4:e4b"

# [Optional tuning and behavior] Defaults are usable without custom edits.
# Changes adjust response behavior, resource use, or supported optional features.
OLLAMA_REQUEST_TIMEOUT_SECONDS: 500
OLLAMA_THINK: true
OLLAMA_AGENT_MAX_OUTPUT_TOKENS: 16384  # per agent model request; .env overrides this
MAI_DEBUG_MODEL_INPUT: false

# Structural execution guards (no global agent round cap).
AGENT_MAX_IDENTICAL_CALLS: 3
AGENT_MAX_IDENTICAL_FAILURES: 2
AGENT_MAX_NO_PROGRESS_ROUNDS: 2
TOOL_TIMEOUT_SECONDS: 60
TERMINAL_TIMEOUT_SECONDS: 120
MAX_INLINE_TOOL_RESULT_CHARS: 8000
MEMORY_RECALL_INCLUDE_UTTERANCES: false
SESSION_HISTORY_MESSAGES: 10
MAI_ANSWER_QUALITY_REVIEW: true

# Optional voice behavior. Audio availability also depends on installed packages
# and microphone/browser permissions; changing these values cannot supply them.
VOICE_SILENCE_SECONDS: 5
VOICE_MIN_SPEECH_SECONDS: 0.5
VOICE_MATCH_THRESHOLD: 0.65
VOICE_WHISPER_MODEL: small
