[project]
name = "mai-myai-sllm"
version = "0.1.0"
description = "llama.cpp-based personal agent runtime with graph memory"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3.0,<5",
  "beautifulsoup4>=4.13",
  "ddgs>=9.0",
  "fastapi>=0.116.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "playwright>=1.55",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0",
  "vadonnx>=0.1",
  "scipy>=1.13",
  "faster-whisper>=1.1",
  "numpy>=1.24",
  "mcp-memorizer @ git+https://github.com/FoggyCaligo/MCP_memorizer.git@ea4015393c9de50021c253f58a026d926f7b58ed",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-ruby>=0.23",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
include = ["mai*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
"mai.app" = ["static/*.html", "static/*.js", "static/*.ps1", "static/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
remote = [
  "beautifulsoup4>=4.13",
  "ddgs>=9.0",
  "httpx>=0.27",
  "markdown-it-py>=3.0,<5",
  "openpyxl>=3.1",
  "playwright>=1.55",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-rust>=0.23",
  "tree-sitter-ruby>=0.23",
]
