[project]
name = "mai-myai-sllm"
version = "0.1.0"
description = "Ollama-native personal agent runtime with graph memory"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
