<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0f12;--surface:#18181f;--border:#2a2a35;--accent:#5ea0ff;--accent-dim:#2f4d7a;--text:#e4e4ef;--dim:#7e8296;--user:#252538;--bot:#17202d;--danger:#d85b67;--radius:12px;--font:"Segoe UI","Apple SD Gothic Neo",sans-serif}html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}#app{display:flex;flex-direction:column;height:100vh;max-width:980px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg)}.logo{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:2px;min-width:0;font-size:18px;font-weight:700;color:var(--accent)}.logo span{font-size:12px;color:var(--dim);font-weight:400;white-space:nowrap}.header-right{display:flex;align-items:center;gap:8px}.chip,.button{border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:999px;padding:7px 11px;font-size:12px}.button{cursor:pointer}#messages{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}#empty{margin:auto;text-align:center;color:var(--dim);line-height:1.6}.row{display:flex;gap:10px;align-items:flex-start}.row.user{flex-direction:row-reverse}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:10px;font-weight:700}.avatar.bot{background:var(--accent-dim);color:var(--accent)}.avatar.user{background:var(--user);color:var(--dim)}.bubble{width:fit-content;min-width:140px;max-width:min(78%,720px);padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.55;word-break:break-word}.row.user .bubble{background:var(--user);border-top-right-radius:4px;white-space:pre-wrap}.row.bot .bubble{background:var(--bot);border-top-left-radius:4px;min-width:220px}.markdown{white-space:normal}.markdown>*+*{margin-top:.7em}.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{line-height:1.3;color:var(--text)}.markdown h1{font-size:1.55em}.markdown h2{font-size:1.35em}.markdown h3{font-size:1.18em}.markdown h4,.markdown h5,.markdown h6{font-size:1.05em}.markdown p{white-space:pre-wrap}.markdown ul,.markdown ol{padding-left:1.45em}.markdown li+li{margin-top:.25em}.markdown blockquote{border-left:3px solid var(--accent-dim);padding-left:.8em;color:var(--dim)}.markdown code{font-family:Consolas,"SFMono-Regular",monospace;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:5px;padding:.08em .32em;font-size:.92em}.markdown pre{overflow:auto;padding:10px 12px;background:#10151d;border:1px solid var(--border);border-radius:8px;white-space:pre}.markdown pre code{padding:0;border:0;background:transparent;white-space:pre}.markdown a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}.markdown hr{border:0;border-top:1px solid var(--border)}.markdown strong{font-weight:700}.markdown em{font-style:italic}.markdown del{opacity:.75}.toolbox{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;color:var(--dim);font-size:11px}.toolbox summary{cursor:pointer}.toolitem{margin-top:6px;padding:7px;border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:180px;white-space:pre-wrap}.thinking-loader{display:flex;gap:5px;padding:10px 14px;background:var(--bot);border-radius:var(--radius);border-top-left-radius:4px;width:fit-content;min-width:96px;align-items:center;min-height:41px}.thinking-loader span{width:7px;height:7px;border-radius:50%;background:var(--accent-dim);animation:thinking-bounce .9s infinite}.thinking-loader span:nth-child(2){animation-delay:.15s}.thinking-loader span:nth-child(3){animation-delay:.3s}@keyframes thinking-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px);background:var(--accent)}}#input-area{border-top:1px solid var(--border);padding:12px 20px;background:var(--bg)}#attachments{display:none;gap:6px;flex-wrap:wrap;margin-bottom:8px}.attachment{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 9px;color:var(--dim);font-size:12px}#input-row{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}textarea{flex:1;min-height:24px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:14px var(--font)}#attach,#send{border:0;border-radius:8px;cursor:pointer;height:34px}#attach{width:34px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--dim);font-size:18px}#send{background:var(--accent);color:white;padding:0 16px;font-weight:700}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,5,8,.86);backdrop-filter:blur(8px);padding:20px}.overlay.hidden{display:none}.modal{width:min(420px,100%);padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.modal h2{color:var(--accent);margin-bottom:8px}.modal p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:16px}.login-row{display:flex;gap:8px}.login-row input{flex:1;min-width:0;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:0;-webkit-text-security:disc}.login-row button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);font-weight:700;cursor:pointer}.error{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.header-right{width:100%;flex-wrap:wrap;justify-content:flex-start}.bubble{min-width:0;max-width:calc(100% - 52px)}.row.bot .bubble{min-width:0}#messages,#input-area{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div id="login" class="overlay"><form id="login-form" class="modal"><h2>Mai 로그인</h2><p>허용된 접속 ID를 입력해 주세요.</p><div class="login-row"><input id="login-id" autocomplete="off" placeholder="접속 ID"><button>접속</button></div><div id="login-error" class="error"></div></form></div>
<div id="app"><header><div class="logo">Mai <span>tool-using semantic memory agent</span></div><div class="header-right"><span id="account" class="chip">로그인 필요</span><span id="model" class="chip">모델 확인 중...</span><button id="logout" class="button">로그아웃</button></div></header><main id="messages"><div id="empty"><div style="font-size:36px;color:var(--accent);font-weight:700">Mai</div><div>기억과 도구를 사용하는 로컬 sLLM</div></div></main><div id="input-area"><div id="attachments"></div><div id="input-row"><textarea id="message" rows="1" placeholder="메시지를 입력하세요..."></textarea><input id="file" type="file" multiple hidden><button id="attach" title="파일 첨부">📎</button><button id="send">전송</button></div></div></div>
<script>
const state={files:[],activeJobs:new Set()};const $=id=>document.getElementById(id);const messages=$("messages"),empty=$("empty"),input=$("message");
function node(tag,text=null,className=null){const el=document.createElement(tag);if(className)el.className=className;if(text!==null)el.textContent=text;return el}
function appendInline(parent,text){const token=/(\*\*[^*]+\*\*|__[^_]+__|~~[^~]+~~|`[^`]+`|\*[^*\n]+\*|_[^_\n]+_|\[[^\]]+\]\(https?:\/\/[^\s)]+\))/g;let last=0;for(const match of text.matchAll(token)){if(match.index>last)parent.appendChild(document.createTextNode(text.slice(last,match.index)));const raw=match[0];let el;if(raw.startsWith('**')||raw.startsWith('__')){el=node('strong');appendInline(el,raw.slice(2,-2))}else if(raw.startsWith('~~')){el=node('del');appendInline(el,raw.slice(2,-2))}else if(raw.startsWith('`')){el=node('code',raw.slice(1,-1))}else if(raw.startsWith('*')||raw.startsWith('_')){el=node('em');appendInline(el,raw.slice(1,-1))}else{const parts=raw.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);el=node('a',parts[1]);el.href=parts[2];el.target='_blank';el.rel='noopener noreferrer'}parent.appendChild(el);last=match.index+raw.length}if(last<text.length)parent.appendChild(document.createTextNode(text.slice(last)))}
function renderMarkdown(text){const root=node('div',null,'markdown');const lines=String(text??'').replace(/\r\n?/g,'\n').split('\n');let i=0;while(i<lines.length){const line=lines[i];if(line.startsWith('```')){const lang=line.slice(3).trim();const code=[];i++;while(i<lines.length&&!lines[i].startsWith('```')){code.push(lines[i]);i++}if(i<lines.length)i++;const pre=node('pre'),c=node('code',code.join('\n'));if(lang)c.dataset.language=lang;pre.appendChild(c);root.appendChild(pre);continue}if(!line.trim()){i++;continue}const heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){const h=node(`h${heading[1].length}`);appendInline(h,heading[2]);root.appendChild(h);i++;continue}if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)){root.appendChild(node('hr'));i++;continue}if(/^>\s?/.test(line)){const quote=[];while(i<lines.length&&/^>\s?/.test(lines[i])){quote.push(lines[i].replace(/^>\s?/,''));i++}const bq=node('blockquote');appendInline(bq,quote.join('\n'));root.appendChild(bq);continue}const ul=line.match(/^\s*[-+*]\s+(.+)$/),ol=line.match(/^\s*\d+[.)]\s+(.+)$/);if(ul||ol){const list=node(ul?'ul':'ol');const re=ul?/^\s*[-+*]\s+(.+)$/:/^\s*\d+[.)]\s+(.+)$/;while(i<lines.length){const item=lines[i].match(re);if(!item)break;const li=node('li');appendInline(li,item[1]);list.appendChild(li);i++}root.appendChild(list);continue}const paragraph=[];while(i<lines.length&&lines[i].trim()&&!lines[i].startsWith('```')&&!/^(#{1,6})\s+/.test(lines[i])&&!/^>\s?/.test(lines[i])&&!/^\s*[-+*]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(lines[i])){paragraph.push(lines[i]);i++}const p=node('p');for(let j=0;j<paragraph.length;j++){if(j)p.appendChild(document.createElement('br'));appendInline(p,paragraph[j])}root.appendChild(p)}return root}
function bubble(role,text,tools=[]){empty?.remove();const row=node('div');row.className=`row ${role}`;const avatar=node('div',role==='bot'?'Mai':'나',`avatar ${role}`);const b=node('div');b.className='bubble';if(role==='bot')b.appendChild(renderMarkdown(text));else b.textContent=text;if(tools.length){const d=node('details',null,'toolbox'),s=node('summary',`도구 ${tools.length}건`);d.appendChild(s);for(const t of tools)d.appendChild(node('div',JSON.stringify(t,null,2),'toolitem'));b.appendChild(d)}row.append(avatar,b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row}
function thinkingBubble(){empty?.remove();const row=node('div');row.className='row bot';row.setAttribute('aria-label','Mai가 생각 중');const avatar=node('div','Mai','avatar bot'),loader=node('div',null,'thinking-loader');loader.setAttribute('aria-hidden','true');for(let i=0;i<3;i++)loader.appendChild(node('span'));row.append(avatar,loader);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row}
function roleLabel(role){return role==='owner'?'소유자':'체험판'}function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function json(url,options={}){const r=await fetch(url,options);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`${r.status} ${r.statusText}`);return data}
async function pollJob(jobId,loading){state.activeJobs.add(jobId);try{for(;;){const job=await json(`/chat/jobs/${encodeURIComponent(jobId)}`);if(job.status==='pending'||job.status==='running'){await sleep(700);continue}loading.remove();if(job.status==='completed'&&job.response){bubble('bot',job.response.answer,job.response.work_events||[])}else{bubble('bot',`오류: ${job.error||`chat job ${job.status}`}`)}break}}catch(err){loading.remove();bubble('bot',`오류: ${err.message}`)}finally{state.activeJobs.delete(jobId);input.focus()}}
async function restoreActiveJobs(){const data=await json('/chat/jobs');for(const job of data.jobs||[]){if(state.activeJobs.has(job.job_id))continue;const request=job.request||{};bubble('user',request.message||'');const loading=thinkingBubble();pollJob(job.job_id,loading)}}
async function boot(){try{const rt=await json('/runtime');$('login').classList.add('hidden');$('account').textContent=roleLabel(rt.role);$('model').textContent=rt.model;const h=await json('/history');for(const m of h.messages||[])bubble(m.role==='assistant'?'bot':'user',m.content);await restoreActiveJobs()}catch(e){$('login').classList.remove('hidden')}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-error').textContent='';try{await json('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('login-id').value})});location.reload()}catch(err){$('login-error').textContent=err.message}});$('logout').onclick=async()=>{try{await json('/auth/logout',{method:'POST'})}finally{location.reload()}};$('attach').onclick=()=>$('file').click();$('file').onchange=async()=>{if(!$('file').files.length)return;const fd=new FormData();for(const f of $('file').files)fd.append('files',f);try{const data=await json('/upload',{method:'POST',body:fd});state.files.push(...data.files);renderFiles()}catch(err){alert(err.message)}finally{$('file').value=''}};
function renderFiles(){const el=$('attachments');el.replaceChildren();el.style.display=state.files.length?'flex':'none';for(const f of state.files)el.appendChild(node('span',f.name,'attachment'))}
async function send(){const text=input.value.trim();if(!text)return;bubble('user',text);input.value='';const loading=thinkingBubble();try{const data=await json('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,attachments:state.files.map(f=>f.path)})});state.files=[];renderFiles();pollJob(data.job_id,loading)}catch(err){loading.remove();bubble('bot',`오류: ${err.message}`)}finally{input.focus()}}
$('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});boot();
</script>
</body></html>
