<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0} :root{--bg:#0f0f12;--surface:#18181f;--border:#2a2a35;--accent:#5ea0ff;--accent-dim:#2f4d7a;--text:#e4e4ef;--dim:#7e8296;--user:#252538;--bot:#17202d;--danger:#d85b67;--radius:12px;--font:"Segoe UI","Apple SD Gothic Neo",sans-serif} html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font)} #app{display:flex;flex-direction:column;height:100vh;max-width:980px;margin:auto} header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg)} .logo{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:2px;min-width:0;font-size:18px;font-weight:700;color:var(--accent)} .logo span{font-size:12px;color:var(--dim);font-weight:400;white-space:nowrap}.header-right{display:flex;align-items:center;gap:8px}.chip,.button{border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:999px;padding:7px 11px;font-size:12px}.button{cursor:pointer}#messages{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}#empty{margin:auto;text-align:center;color:var(--dim);line-height:1.6}.row{display:flex;gap:10px;align-items:flex-start}.row.user{flex-direction:row-reverse}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:10px;font-weight:700}.avatar.bot{background:var(--accent-dim);color:var(--accent)}.avatar.user{background:var(--user);color:var(--dim)}.bubble{width:fit-content;min-width:140px;max-width:min(78%,720px);padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.row.user .bubble{background:var(--user);border-top-right-radius:4px}.row.bot .bubble{background:var(--bot);border-top-left-radius:4px;min-width:220px}.toolbox{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;color:var(--dim);font-size:11px}.toolbox summary{cursor:pointer}.toolitem{margin-top:6px;padding:7px;border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:180px;white-space:pre-wrap}.thinking-loader{display:flex;gap:5px;padding:10px 14px;background:var(--bot);border-radius:var(--radius);border-top-left-radius:4px;width:fit-content;min-width:96px;align-items:center;min-height:41px}.thinking-loader span{width:7px;height:7px;border-radius:50%;background:var(--accent-dim);animation:thinking-bounce .9s infinite}.thinking-loader span:nth-child(2){animation-delay:.15s}.thinking-loader span:nth-child(3){animation-delay:.3s}@keyframes thinking-bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px);background:var(--accent)}}#input-area{border-top:1px solid var(--border);padding:12px 20px;background:var(--bg)}#attachments{display:none;gap:6px;flex-wrap:wrap;margin-bottom:8px}.attachment{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 9px;color:var(--dim);font-size:12px}#input-row{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}textarea{flex:1;min-height:24px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:14px var(--font)}#attach,#send{border:0;border-radius:8px;cursor:pointer;height:34px}#attach{width:34px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--dim);font-size:18px}#send{background:var(--accent);color:white;padding:0 16px;font-weight:700}.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(5,5,8,.86);backdrop-filter:blur(8px);padding:20px}.overlay.hidden{display:none}.modal{width:min(420px,100%);padding:24px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.modal h2{color:var(--accent);margin-bottom:8px}.modal p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:16px}.login-row{display:flex;gap:8px}.login-row input{flex:1;min-width:0;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:0;-webkit-text-security:disc}.login-row button{padding:11px 16px;border:0;border-radius:10px;background:var(--accent);font-weight:700;cursor:pointer}.error{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}.header-right{width:100%;flex-wrap:wrap;justify-content:flex-start}.bubble{min-width:0;max-width:calc(100% - 52px)}.row.bot .bubble{min-width:0}#messages,#input-area{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div id="login" class="overlay"><form id="login-form" class="modal"><h2>Mai 로그인</h2><p>허용된 접속 ID를 입력해 주세요.</p><div class="login-row"><input id="login-id" autocomplete="off" placeholder="접속 ID"><button>접속</button></div><div id="login-error" class="error"></div></form></div>
<div id="app"><header><div class="logo">Mai <span>tool-using semantic memory agent</span></div><div class="header-right"><span id="account" class="chip">로그인 필요</span><span id="model" class="chip">모델 확인 중...</span><button id="logout" class="button">로그아웃</button></div></header><main id="messages"><div id="empty"><div style="font-size:36px;color:var(--accent);font-weight:700">Mai</div><div>기억과 도구를 사용하는 로컬 sLLM</div></div></main><div id="input-area"><div id="attachments"></div><div id="input-row"><textarea id="message" rows="1" placeholder="메시지를 입력하세요..."></textarea><input id="file" type="file" multiple hidden><button id="attach" title="파일 첨부">📎</button><button id="send">전송</button></div></div></div>
<script>
const state={files:[],activeJobs:new Set()};const $=id=>document.getElementById(id);const messages=$("messages"),empty=$("empty"),input=$("message");
function bubble(role,text,tools=[]){empty?.remove();const row=document.createElement("div");row.className=`row ${role}`;const avatar=document.createElement("div");avatar.className=`avatar ${role}`;avatar.textContent=role==="bot"?"Mai":"나";const b=document.createElement("div");b.className="bubble";b.textContent=text;if(tools.length){const d=document.createElement("details");d.className="toolbox";const s=document.createElement("summary");s.textContent=`도구 ${tools.length}건`;d.appendChild(s);for(const t of tools){const i=document.createElement("div");i.className="toolitem";i.textContent=JSON.stringify(t,null,2);d.appendChild(i)}b.appendChild(d)}row.append(avatar,b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row}
function thinkingBubble(){empty?.remove();const row=document.createElement('div');row.className='row bot';row.setAttribute('aria-label','Mai가 생각 중');const avatar=document.createElement('div');avatar.className='avatar bot';avatar.textContent='Mai';const loader=document.createElement('div');loader.className='thinking-loader';loader.setAttribute('aria-hidden','true');for(let i=0;i<3;i++)loader.appendChild(document.createElement('span'));row.append(avatar,loader);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return row}
function roleLabel(role){return role==='owner'?'소유자':'체험판'}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function json(url,options={}){const r=await fetch(url,options);let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.detail||`${r.status} ${r.statusText}`);return data}
async function pollJob(jobId,loading){state.activeJobs.add(jobId);try{for(;;){const job=await json(`/chat/jobs/${encodeURIComponent(jobId)}`);if(job.status==='pending'||job.status==='running'){await sleep(700);continue}loading.remove();if(job.status==='completed'&&job.response){bubble('bot',job.response.answer,job.response.work_events||[])}else{bubble('bot',`오류: ${job.error||`chat job ${job.status}`}`)}break}}catch(err){loading.remove();bubble('bot',`오류: ${err.message}`)}finally{state.activeJobs.delete(jobId);input.focus()}}
async function restoreActiveJobs(){const data=await json('/chat/jobs');for(const job of data.jobs||[]){if(state.activeJobs.has(job.job_id))continue;const request=job.request||{};bubble('user',request.message||'');const loading=thinkingBubble();pollJob(job.job_id,loading)}}
async function boot(){try{const rt=await json('/runtime');$('login').classList.add('hidden');$('account').textContent=roleLabel(rt.role);$('model').textContent=rt.model;const h=await json('/history');for(const m of h.messages||[])bubble(m.role==='assistant'?'bot':'user',m.content);await restoreActiveJobs()}catch(e){$('login').classList.remove('hidden')}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-error').textContent='';try{await json('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$('login-id').value})});location.reload()}catch(err){$('login-error').textContent=err.message}});
$('logout').onclick=async()=>{try{await json('/auth/logout',{method:'POST'})}finally{location.reload()}};
$('attach').onclick=()=>$('file').click();$('file').onchange=async()=>{if(!$('file').files.length)return;const fd=new FormData();for(const f of $('file').files)fd.append('files',f);try{const data=await json('/upload',{method:'POST',body:fd});state.files.push(...data.files);renderFiles()}catch(err){alert(err.message)}finally{$('file').value=''}};
function renderFiles(){const el=$('attachments');el.innerHTML='';el.style.display=state.files.length?'flex':'none';for(const f of state.files){const c=document.createElement('span');c.className='attachment';c.textContent=f.name;el.appendChild(c)}}
async function send(){const text=input.value.trim();if(!text)return;bubble('user',text);input.value='';const loading=thinkingBubble();try{const data=await json('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,attachments:state.files.map(f=>f.path)})});state.files=[];renderFiles();pollJob(data.job_id,loading)}catch(err){loading.remove();bubble('bot',`오류: ${err.message}`)}finally{input.focus()}}
$('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});boot();
</script>
</body></html>
