<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAI</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#0f0f12; --surface:#18181f; --border:#2a2a35; --accent:#7c6af7; --accent-dim:#4a4280;
      --text:#e4e4ef; --text-dim:#6b6b80; --user-bg:#252538; --mai-bg:#1c1c28; --danger:#e05260;
      --meta:#77778d; --radius:12px; --font:'Segoe UI','Apple SD Gothic Neo',sans-serif;
    }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); }
    button, input, select, textarea { font:inherit; }
    #app { display:none; flex-direction:column; height:100dvh; max-width:860px; margin:0 auto; }
    #login-screen { min-height:100dvh; display:grid; place-items:center; padding:20px; }
    .login-card { width:min(380px,100%); background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; }
    .login-logo { color:var(--accent); font-size:28px; font-weight:700; margin-bottom:6px; }
    .login-sub { color:var(--text-dim); font-size:13px; margin-bottom:20px; }
    .login-row { display:flex; gap:8px; }
    #login-id, #login-password { flex:1; min-width:0; background:#121218; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:11px 12px; outline:none; }
    #login-id:focus, #login-password:focus { border-color:var(--accent); }
    .primary-btn { border:0; border-radius:10px; background:var(--accent); color:#fff; padding:10px 15px; font-weight:600; cursor:pointer; }
    .primary-btn:disabled { opacity:.45; cursor:wait; }
    #login-btn { background:var(--accent); color:#fff; border-color:transparent; }
    #login-error { min-height:18px; margin-top:10px; color:var(--danger); font-size:12px; }

    header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; min-width:0; }
    .header-top { display:flex; flex:1 1 280px; align-items:center; gap:10px; min-width:min(100%, 280px); }
    .header-selects { flex:1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; min-width:0; }
    .brand { min-width:0; } .logo { color:var(--accent); font-size:18px; font-weight:700; letter-spacing:.5px; }
    .subtitle { color:var(--text-dim); font-size:11px; margin-top:2px; }
    .header-right { display:flex; flex:0 0 auto; align-items:center; justify-content:flex-end; gap:8px; min-width:0; margin-left:auto; flex-wrap:nowrap; }
    #model-select, #tts-voice-select { display:block; width:100%; min-width:0; max-width:none; height:34px; padding:6px 9px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text); font-size:12px; line-height:20px; outline:none; text-overflow:ellipsis; }
    #model-select:focus, #tts-voice-select:focus { border-color:var(--accent); }
    #logout-btn { background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:20px; padding:6px 10px; cursor:pointer; }
    #logout-btn:hover { border-color:var(--accent); color:var(--text); }
    #remote-btn { background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:20px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
    #remote-btn:hover { border-color:var(--accent); color:var(--text); }
    #remote-btn[hidden] { display:none; }
    #remote-panel[hidden] { display:none; }
    #remote-panel { position:fixed; z-index:100; top:64px; right:18px; width:min(410px,calc(100vw - 36px)); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 16px 40px #0009; display:grid; gap:10px; }
    #remote-panel h2 { font-size:15px; }
    #remote-panel p { font-size:12px; color:var(--text-dim); line-height:1.5; }
    #remote-panel code { overflow-wrap:anywhere; white-space:pre-wrap; font-size:12px; }
    #remote-panel .remote-secret { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:8px; }
    .remote-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .remote-actions button { border:1px solid var(--border); border-radius:7px; padding:6px 10px; background:var(--bg); color:var(--text); cursor:pointer; }
    #remote-error { color:var(--danger); font-size:12px; white-space:pre-wrap; }
    #remote-status { color:var(--text); font-size:12px; }

    #messages { flex:1; min-height:0; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
    #messages::-webkit-scrollbar { width:5px; } #messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
    #empty-state { margin:auto; color:var(--text-dim); text-align:center; user-select:none; }
    #empty-state .big { color:var(--accent); font-size:34px; font-weight:700; margin-bottom:8px; }
    .msg-row { display:flex; gap:10px; align-items:flex-start; width:100%; }
    .msg-row.user { flex-direction:row-reverse; }
    .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; font-size:12px; font-weight:700; }
    .avatar.mai { background:var(--accent-dim); color:#c9c1ff; } .avatar.user { background:var(--user-bg); color:var(--text-dim); }
    .content-wrap { max-width:78%; min-width:0; } .msg-row.mai .content-wrap { max-width:calc(100% - 42px); flex:1; }
    .bubble { padding:12px 16px; border-radius:var(--radius); font-size:14px; line-height:1.65; overflow-wrap:anywhere; }
    .msg-row.user .bubble { background:var(--user-bg); border-top-right-radius:4px; white-space:pre-wrap; }
    .msg-row.mai .bubble { background:var(--mai-bg); border-top-left-radius:4px; }
    .bubble p + p { margin-top:.8em; } .bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin:.8em 0 .4em; line-height:1.3; }
    .bubble h1 { font-size:1.35em; } .bubble h2 { font-size:1.22em; } .bubble h3 { font-size:1.1em; }
    .bubble ul,.bubble ol { padding-left:1.45em; margin:.55em 0; } .bubble li + li { margin-top:.22em; }
    .bubble blockquote { border-left:3px solid var(--accent-dim); padding-left:10px; color:#b8b8c8; margin:.6em 0; }
    .bubble code { background:#121218; padding:2px 5px; border-radius:5px; font-family:Consolas,monospace; font-size:.92em; }
    .bubble pre { background:#121218; border:1px solid var(--border); border-radius:8px; padding:11px; overflow:auto; margin:.7em 0; }
    .bubble pre code { background:none; padding:0; } .bubble a { color:#a99cff; }
    .bubble .table-scroll { max-width:100%; overflow-x:auto; }
  .bubble table { border-collapse:collapse; width:100%; margin:.7em 0; font-size:13px; } .bubble th,.bubble td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
    .bubble th { background:var(--surface); }

    .loader { display:flex; align-items:center; gap:5px; min-height:18px; }
    .loader span { width:7px; height:7px; border-radius:50%; background:var(--accent-dim); animation:bounce .9s infinite; }
    .loader span:nth-child(2) { animation-delay:.15s; } .loader span:nth-child(3) { animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-6px); background:var(--accent); } }

    .message-timestamp { margin-top:5px; font-size:11px; color:var(--meta); }
    .mai-action-icon { width:18px; height:18px; display:block; flex-shrink:0; }
    button[data-mai-icon], .icon-button { min-width:34px; min-height:34px; display:inline-grid; place-items:center; padding:7px; border:1px solid var(--border); border-radius:9px; background:transparent; color:var(--text-dim); cursor:pointer; }
    button[data-mai-icon][hidden] { display:none; }
    button[data-mai-icon]:hover,.icon-button:hover { color:var(--text); border-color:var(--accent-dim); }
    button[data-mai-icon]:focus-visible,.icon-button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .verify-switch .mai-action-icon { width:18px; height:18px; }
    .verify-switch:has(input:checked) { color:var(--accent); }
    #remote-btn.connected { color:var(--accent); border-color:var(--accent); }
    #send-btn { width:36px; height:34px; min-width:36px; padding:7px; display:grid; place-items:center; }
    #send-btn .mai-action-icon { width:19px; height:19px; }
    .verify-switch { font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:4px; white-space:nowrap; }
    .diagnostics { margin-top:7px; font-size:11px; color:var(--meta); }
    details.tool-log { margin-top:8px; border-top:1px solid var(--border); padding-top:7px; }
    details.tool-log summary { color:var(--meta); font-size:11px; cursor:pointer; user-select:none; }
    .tool-log-entries { max-height:340px; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; }
    .tool-entry { margin-top:7px; padding:8px 10px; background:#15151c; border-radius:8px; font-size:11px; }
    .tool-entry > summary { cursor:pointer; user-select:none; }
    .tool-entry > summary .tool-head { display:inline-flex; width:calc(100% - 16px); vertical-align:middle; }
    .tool-head { display:flex; justify-content:space-between; gap:10px; color:#aaaabd; } .tool-failed { color:var(--danger); }
    .tool-args,.tool-result { margin-top:5px; color:#85859b; white-space:pre-wrap; font-family:Consolas,monospace; overflow-wrap:anywhere; }
    .tool-result { color:#a2a2b5; overflow-wrap:anywhere; } .error { border:1px solid #7c3642; background:#26171c !important; }
    .interrupted { color:var(--meta); font-size:12px; }

    #input-area { flex-shrink:0; border-top:1px solid var(--border); padding:14px 18px; background:var(--bg); }
    #upload-status { min-height:16px; margin:0 3px 6px; color:var(--text-dim); font-size:11px; overflow-wrap:anywhere; }
    #upload-status.failed { color:var(--danger); }
    #clipboard-previews { display:flex; flex-wrap:wrap; gap:8px; margin:0 3px 8px; }
    .clipboard-preview { position:relative; border:1px solid var(--border); border-radius:8px; padding:5px; background:var(--surface); }
    .clipboard-preview img { display:block; width:90px; height:72px; object-fit:contain; }
    .message-images { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .message-image { border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:4px; cursor:zoom-in; }
    .message-image img { display:block; max-width:210px; max-height:160px; object-fit:contain; }
    .image-preview-dialog { border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--surface); color:var(--text); max-width:95vw; max-height:95vh; margin:auto; }
    .image-preview-dialog::backdrop { background:#000c; }
    .image-preview-dialog img { display:block; max-width:calc(95vw - 28px); max-height:calc(95vh - 72px); object-fit:contain; }
    .image-preview-dialog button { display:block; margin:0 0 8px auto; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:4px 10px; border-radius:6px; cursor:pointer; }
    .clipboard-preview button { position:absolute; top:2px; right:2px; border:0; border-radius:6px; background:var(--bg); color:var(--danger); cursor:pointer; }
    #input-row { display:flex; align-items:flex-end; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; }
    #input-row:focus-within { border-color:var(--accent-dim); }
    #upload-btn { width:31px; height:31px; display:grid; place-items:center; flex-shrink:0; border:1px solid var(--border); border-radius:8px; color:var(--text-dim); cursor:pointer; user-select:none; }
    #upload-btn:hover { color:var(--text); border-color:var(--accent-dim); }
    #upload-btn.busy { opacity:.45; pointer-events:none; }
    #file-input { display:none; }
    #msg-input { flex:1; min-height:24px; max-height:150px; resize:none; border:none; outline:none; background:transparent; color:var(--text); font:14px/1.5 var(--font); }
    #msg-input::placeholder { color:var(--text-dim); }
    #send-btn { border:none; border-radius:8px; padding:0; background:var(--accent); color:#fff; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
    #send-btn:hover { background:#9585ff; } #send-btn:disabled { opacity:.4; cursor:default; }
    #send-btn.stop-mode { background:#26171c; color:var(--danger); }
    #send-btn.stop-mode:hover { background:#321c22; }
    #mic-btn, #tts-toggle-btn { border:0; background:transparent; padding:5px; color:var(--text-dim); cursor:pointer; display:grid; place-items:center; flex-shrink:0; }
    #mic-btn svg, #tts-toggle-btn svg { width:20px; height:20px; stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    #tts-toggle-btn.muted { color:var(--danger); }
    #tts-toggle-btn .mute-line { display:none; }
    #tts-toggle-btn.muted .mute-line { display:block; }
    #tts-voice-select:disabled { opacity:.5; }
    #mic-btn.active { color:var(--danger); }
    #mic-btn:disabled { opacity:.35; cursor:wait; }

    @media (max-width:680px) {
      header { padding:8px 10px; gap:6px; }
      .header-top { gap:8px; }
      .header-selects { gap:6px; }
      .header-right { gap:7px; }
      #model-select, #tts-voice-select { font-size:11px; padding:5px 6px; height:32px; }
      #messages { padding:16px 10px; } #input-area { padding:6px 8px; } #input-row { gap:6px; padding:6px 8px; }
      #upload-status:empty { min-height:0; margin-bottom:0; }
      .content-wrap, .msg-row.mai .content-wrap { max-width:88%; }
    }
  </style>
</head>
<body>
<div id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-logo">MAI</div>
    <div class="login-sub">Sign in to MAI</div>
    <div class="login-row"><input id="login-id" autocomplete="username" placeholder="ID" aria-label="User ID" required /></div>
    <div class="login-row" style="margin-top:8px"><input id="login-password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required /><button class="primary-btn icon-button" id="login-btn" type="submit" data-mai-icon="log-in" data-mai-label="Sign in"></button></div>
    <div id="login-error"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="header-top">
      <div class="brand"><div class="logo">MAI</div><div class="subtitle">local personal agent</div></div>
      <div class="header-selects">
        <select id="model-select" aria-label="Model" title="Model"><option value="">Loading models…</option></select>
        <select id="tts-voice-select" aria-label="Voice" title="Voice"><option value="">Default</option></select>
      </div>
    </div>
    <div class="header-right">
      <label class="verify-switch" title="Verify answers"><input type="checkbox" id="verify-toggle" aria-label="Verify answers" /><svg class="mai-action-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></label>
      <button id="remote-btn" type="button" hidden aria-expanded="false" aria-controls="remote-panel" data-mai-icon="monitor" data-mai-label="Remote connection"></button>
      <button id="logout-btn" type="button" data-mai-icon="log-out" data-mai-label="Sign out"></button>
    </div>
  </header>
  <section id="remote-panel" hidden role="dialog" aria-label="Remote connection">
    <h2 id="remote-title">Remote connection</h2>
    <p id="remote-instruction">Run the command on your remote device.</p>
    <div>
      <label for="remote-platform" style="font-size:12px;color:var(--text-dim)">Remote OS</label>
      <select id="remote-platform" style="margin-left:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 7px">
        <option value="windows">Windows PowerShell</option>
        <option value="linux">Linux shell</option>
      </select>
    </div>
    <div id="remote-status" role="status">Waiting</div>
    <div id="remote-details" hidden>
      <p>Copy the command manually. It contains a one-time secret; do not share it.</p>
      <div class="remote-secret"><code id="remote-command"></code></div>
    </div>
    <div id="remote-error" role="alert"></div>
    <div class="remote-actions">
      <button id="remote-create" type="button" hidden data-mai-icon="copy" data-mai-label="Copy connection command"></button>
      <button id="remote-close" type="button" data-mai-icon="unlink" data-mai-label="Disconnect"></button>
      <button id="remote-hide" type="button" data-mai-icon="x" data-mai-label="Close"></button>
    </div>
  </section>
  <div id="messages"><div id="empty-state"><div class="big">MAI</div><div>Start a conversation</div></div></div>
  <div id="input-area">
    <form id="chat-form">
      <div id="upload-status" role="status" aria-live="polite"></div>
      <div id="clipboard-previews" aria-label="Attachment previews"></div>
      <div id="input-row">
        <label id="upload-btn" title="Attach file" aria-label="Attach file"><svg class="mai-action-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><input id="file-input" type="file" aria-label="Attach file" /></label>
        <textarea id="msg-input" rows="1" placeholder="Message..." aria-label="Message" required></textarea>
        <button id="mic-btn" type="button" title="Start listening" aria-label="Start listening" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button>
        <button id="tts-toggle-btn" class="muted" type="button" title="Enable voice output" aria-label="Enable voice output" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/><path class="mute-line" d="M3 3 21 21"/></svg></button>
        
        <button id="send-btn" type="submit" aria-label="Send" title="Send"><svg class="mai-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
      </div>
    </form>
  </div>
</div>

<script>
  // Local SVG icon set: no CDN, external font, or runtime dependency.
  const MAI_ICONS = Object.freeze({
    'log-in':'<path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>',
    'log-out':'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    'monitor':'<rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8m-4-4v4"/>',
    'shield-check':'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
    'plus':'<path d="M12 5v14M5 12h14"/>',
    'send':'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    'square':'<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/>',
    'x':'<path d="M18 6 6 18M6 6l12 12"/>',
    'link':'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    'unlink':'<path d="M10 13a5 5 0 0 0 7.54.54l1-1M14 11a5 5 0 0 0-7.54-.54l-1 1M2 2l20 20"/>',
    'copy':'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
    'message-plus':'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3H14M19 2v8m-4-4h8"/>',
    'check':'<path d="m5 12 4 4L19 6"/>'
  });
  function maiIconMarkup(name) {
    const paths=MAI_ICONS[name] || MAI_ICONS['plus'];
    return '<svg class="mai-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
  }
  function setMaiIconButton(button, name, label) {
    if(!button) return;
    button.innerHTML=maiIconMarkup(name);
    button.setAttribute('aria-label',label);
    button.title=label;
  }
  document.querySelectorAll('[data-mai-icon]').forEach(button=>{
    setMaiIconButton(button,button.dataset.maiIcon,button.dataset.maiLabel||button.title||'Action');
  });
</script>
<script>
  const state = { token: sessionStorage.getItem('MAI:auth-token'), userId:null, role:null, sessionId:crypto.randomUUID() };
  const $loginPassword=document.getElementById('login-password');
  const $loginScreen=document.getElementById('login-screen'), $loginForm=document.getElementById('login-form'), $loginId=document.getElementById('login-id'), $loginBtn=document.getElementById('login-btn'), $loginError=document.getElementById('login-error');
  const $app=document.getElementById('app'), $messages=document.getElementById('messages'), $form=document.getElementById('chat-form'), $input=document.getElementById('msg-input'), $send=document.getElementById('send-btn'), $model=document.getElementById('model-select'), $logout=document.getElementById('logout-btn'), $fileInput=document.getElementById('file-input'), $uploadBtn=document.getElementById('upload-btn'), $uploadStatus=document.getElementById('upload-status');

  $fileInput.addEventListener('change',async()=>{const file=$fileInput.files?.[0];if(!file)return;$uploadBtn.classList.add('busy');$uploadStatus.classList.remove('failed');$uploadStatus.textContent=`Uploading: ${file.name}`;try{const body=new FormData();body.append('file',file,file.name);const res=await fetch('/upload',{method:'POST',headers:authHeaders(),body});const data=await res.json();if(res.status===401){showLogin(data.detail||'Session expired');return;}if(!res.ok)throw new Error(data.detail||'Upload failed');const reference=`Uploaded file: ${data.path}`;if(file.type.startsWith('image/'))pendingUploadedImages.push(data.filename);$input.value=$input.value.trim()?`${$input.value.trim()}\n${reference}`:reference;$input.dispatchEvent(new Event('input'));$uploadStatus.textContent=`Uploaded: ${data.filename} (${data.bytes} bytes)`;$input.focus();}catch(err){$uploadStatus.classList.add('failed');$uploadStatus.textContent=`Upload failed: ${err.message}`;}finally{$fileInput.value='';$uploadBtn.classList.remove('busy');}});
  $form.addEventListener('submit',async event=>{event.preventDefault();let message=$input.value.trim();if(uploadingClipboardImages||switchingModel)return;if(!message && clipboardImages.length === 0){
    if(activeChat){
      if(replacingChat)return;
      replacingChat=true;
      const interrupted=activeChat;
      try{
        const settle=window.maiSettlePreviousPresentation;
        if(typeof settle==='function'){
          interrupted.pending.finalized=Boolean(await settle(interrupted.pending));
        }
        if(activeChat===interrupted){
          activeChat=null;
          interrupted.controller.abort();
          markInterrupted(interrupted.pending);
        }
      }finally{replacingChat=false;}
      syncSendButton();$input.focus();
    }
    return;
  }if(replacingChat)return;
  if(activeChat){
    replacingChat=true;
    const interrupted=activeChat;
    try{
      // The server may already have completed while the last UI poll is
      // pending. Never replace its final answer with an interruption label.
      const settle=window.maiSettlePreviousPresentation;
      if(typeof settle==='function'){
        interrupted.pending.finalized=Boolean(await settle(interrupted.pending));
      }
      if(activeChat===interrupted){
        activeChat=null;
        interrupted.controller.abort();
        markInterrupted(interrupted.pending);
      }
    }finally{replacingChat=false;}
  }if (clipboardImages.length) {
    uploadingClipboardImages = true;
    $uploadStatus.classList.remove('failed');
    try {
      const references = await uploadClipboardImages();
      message = [message, ...references.map(item=>item.reference)].filter(Boolean).join('\n');
       pendingUploadedImages.push(...references.map(item=>item.filename));
      clipboardImages.forEach(item => URL.revokeObjectURL(item.url));
      clipboardImages.length = 0;
      refreshClipboardPreviews();
    } catch (err) {
      $uploadStatus.classList.add('failed');
      $uploadStatus.textContent = `Image upload failed: ${err.message}`;
      return;
    } finally {
      uploadingClipboardImages = false;
    }
  }
  const attachments=pendingUploadedImages.splice(0);addMessage('user',message,attachments);$input.value='';$input.style.height='auto';$uploadStatus.textContent='';$uploadStatus.classList.remove('failed');const pending=addThinking();const controller=new AbortController();const runId=++chatRunSerial;activeChat={id:runId,controller,pending};syncSendButton();try{const res=await fetch('/chat',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message,session_id:state.sessionId,model:$model.value||null,remote_session_id:remoteSession?.id||null,attachments,verify:document.getElementById('verify-toggle').checked}),signal:controller.signal});const data=await res.json();if(activeChat?.id!==runId)return;if(res.status===401){showLogin(data.detail||'Session expired');return;}if(!res.ok){pending.bubble.classList.add('error');const prefix=data.error_type?`${data.error_type}: `:'';if (typeof data.unverified_answer === 'string') renderUnverifiedAnswer(pending.bubble, data); else pending.bubble.textContent=`Error: ${prefix}${data.detail||JSON.stringify(data)}`;renderVerificationRejections(pending.wrap,data.verification_rejections);renderToolLog(pending.wrap,Array.isArray(data.tools)?data.tools:[],data.model_rounds??0,data.model||$model.value||'unknown');scrollToBottom();return;}pending.bubble.innerHTML=renderMarkdown(data.answer);pending.finalized=true;setMessageTime(pending);document.dispatchEvent(new CustomEvent('mai:answer-complete',{detail:{text:data.answer}}));renderVerificationRejections(pending.wrap,data.verification_rejections);renderToolLog(pending.wrap,data.tools,data.model_rounds,data.model);scrollToBottom();}catch(err){if(err.name==='AbortError'){if(!pending.finalized)markInterrupted(pending);return;}if(activeChat?.id!==runId)return;pending.bubble.classList.add('error');pending.bubble.textContent=`Error: ${err.message}`;scrollToBottom();}finally{if(activeChat?.id===runId)activeChat=null;syncSendButton();$input.focus();}});
  $input.addEventListener('input',()=>{$input.style.height='auto';$input.style.height=`${Math.min($input.scrollHeight,150)}px`;syncSendButton();});
  $input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$form.requestSubmit();}});
  syncSendButton();
  restoreSession();

</script>
