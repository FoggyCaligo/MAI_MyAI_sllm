<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAI</title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#0f0f12; --surface:#18181f; --border:#2a2a35; --accent:#7c6af7; --accent-dim:#4a4280;
      --text:#e4e4ef; --text-dim:#6b6b80; --user-bg:#252538; --mai-bg:#1c1c28; --danger:#e05260;
      --meta:#77778d; --radius:12px; --font:'Segoe UI','Apple SD Gothic Neo',sans-serif;
    }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); }
    button, input, select, textarea { font:inherit; }
    #app { display:none; flex-direction:column; height:100dvh; max-width:860px; margin:0 auto; }
    #login-screen { min-height:100dvh; display:grid; place-items:center; padding:20px; }
    .login-card { width:min(380px,100%); background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; }
    .login-logo { color:var(--accent); font-size:28px; font-weight:700; margin-bottom:6px; }
    .login-sub { color:var(--text-dim); font-size:13px; margin-bottom:20px; }
    .login-row { display:flex; gap:8px; }
    #login-id { flex:1; min-width:0; background:#121218; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:11px 12px; outline:none; }
    #login-id:focus { border-color:var(--accent); }
    .primary-btn { border:0; border-radius:10px; background:var(--accent); color:#fff; padding:10px 15px; font-weight:600; cursor:pointer; }
    .primary-btn:disabled { opacity:.45; cursor:wait; }
    #login-error { min-height:18px; margin-top:10px; color:var(--danger); font-size:12px; }

    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); background:var(--bg); flex-shrink:0; }
    .brand { min-width:0; } .logo { color:var(--accent); font-size:18px; font-weight:700; letter-spacing:.5px; }
    .subtitle { color:var(--text-dim); font-size:11px; margin-top:2px; }
    .header-right { display:flex; align-items:center; gap:8px; min-width:0; }
    #model-select { max-width:220px; min-width:140px; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 11px; border-radius:20px; font-size:12px; outline:none; }
    #model-select:focus { border-color:var(--accent); }
    .identity { color:var(--text-dim); font-size:11px; white-space:nowrap; }
    #logout-btn { background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:20px; padding:6px 10px; cursor:pointer; }
    #logout-btn:hover { border-color:var(--accent); color:var(--text); }

    #messages { flex:1; min-height:0; overflow-y:auto; padding:22px 18px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
    #messages::-webkit-scrollbar { width:5px; } #messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
    #empty-state { margin:auto; color:var(--text-dim); text-align:center; user-select:none; }
    #empty-state .big { color:var(--accent); font-size:34px; font-weight:700; margin-bottom:8px; }
    .msg-row { display:flex; gap:10px; align-items:flex-start; width:100%; }
    .msg-row.user { flex-direction:row-reverse; }
    .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; font-size:12px; font-weight:700; }
    .avatar.mai { background:var(--accent-dim); color:#c9c1ff; } .avatar.user { background:var(--user-bg); color:var(--text-dim); }
    .content-wrap { max-width:78%; min-width:0; } .msg-row.mai .content-wrap { max-width:calc(100% - 42px); flex:1; }
    .bubble { padding:12px 16px; border-radius:var(--radius); font-size:14px; line-height:1.65; overflow-wrap:anywhere; }
    .msg-row.user .bubble { background:var(--user-bg); border-top-right-radius:4px; white-space:pre-wrap; }
    .msg-row.mai .bubble { background:var(--mai-bg); border-top-left-radius:4px; }
    .bubble p + p { margin-top:.8em; } .bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin:.8em 0 .4em; line-height:1.3; }
    .bubble h1 { font-size:1.35em; } .bubble h2 { font-size:1.22em; } .bubble h3 { font-size:1.1em; }
    .bubble ul,.bubble ol { padding-left:1.45em; margin:.55em 0; } .bubble li + li { margin-top:.22em; }
    .bubble blockquote { border-left:3px solid var(--accent-dim); padding-left:10px; color:#b8b8c8; margin:.6em 0; }
    .bubble code { background:#121218; padding:2px 5px; border-radius:5px; font-family:Consolas,monospace; font-size:.92em; }
    .bubble pre { background:#121218; border:1px solid var(--border); border-radius:8px; padding:11px; overflow:auto; margin:.7em 0; }
    .bubble pre code { background:none; padding:0; } .bubble a { color:#a99cff; }
    .bubble table { border-collapse:collapse; width:100%; margin:.7em 0; font-size:13px; } .bubble th,.bubble td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
    .bubble th { background:var(--surface); }

    .loader { display:flex; align-items:center; gap:5px; min-height:18px; }
    .loader span { width:7px; height:7px; border-radius:50%; background:var(--accent-dim); animation:bounce .9s infinite; }
    .loader span:nth-child(2) { animation-delay:.15s; } .loader span:nth-child(3) { animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-6px); background:var(--accent); } }

    .diagnostics { margin-top:7px; font-size:11px; color:var(--meta); }
    details.tool-log { margin-top:8px; border-top:1px solid var(--border); padding-top:7px; }
    details.tool-log summary { color:var(--meta); font-size:11px; cursor:pointer; user-select:none; }
    .tool-entry { margin-top:7px; padding:8px 10px; background:#15151c; border-radius:8px; font-size:11px; }
    .tool-head { display:flex; justify-content:space-between; gap:10px; color:#aaaabd; } .tool-failed { color:var(--danger); }
    .tool-args,.tool-result { margin-top:5px; color:#85859b; white-space:pre-wrap; font-family:Consolas,monospace; overflow-wrap:anywhere; }
    .tool-result { color:#a2a2b5; max-height:220px; overflow:auto; } .error { border:1px solid #7c3642; background:#26171c !important; }

    #input-area { flex-shrink:0; border-top:1px solid var(--border); padding:14px 18px; background:var(--bg); }
    #upload-status { min-height:16px; margin:0 3px 6px; color:var(--text-dim); font-size:11px; overflow-wrap:anywhere; }
    #upload-status.failed { color:var(--danger); }
    #input-row { display:flex; align-items:flex-end; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; }
    #input-row:focus-within { border-color:var(--accent-dim); }
    #upload-btn { width:31px; height:31px; display:grid; place-items:center; flex-shrink:0; border:1px solid var(--border); border-radius:8px; color:var(--text-dim); cursor:pointer; user-select:none; }
    #upload-btn:hover { color:var(--text); border-color:var(--accent-dim); }
    #upload-btn.busy { opacity:.45; pointer-events:none; }
    #file-input { display:none; }
    #msg-input { flex:1; min-height:24px; max-height:150px; resize:none; border:none; outline:none; background:transparent; color:var(--text); font:14px/1.5 var(--font); }
    #msg-input::placeholder { color:var(--text-dim); }
    #send-btn { border:none; border-radius:8px; padding:7px 16px; background:var(--accent); color:#fff; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
    #send-btn:hover { background:#9585ff; } #send-btn:disabled { opacity:.4; cursor:wait; }

    @media (max-width:680px) {
      header { align-items:flex-start; flex-direction:column; padding:12px; }
      .header-right { width:100%; flex-wrap:wrap; } #model-select { flex:1; min-width:0; max-width:none; }
      #messages { padding:16px 10px; } #input-area { padding:10px; } .content-wrap, .msg-row.mai .content-wrap { max-width:88%; }
    }
  </style>
</head>
<body>
<div id="login-screen">
  <form class="login-card" id="login-form">
    <div class="login-logo">MAI</div>
    <div class="login-sub">등록된 ID로 접속하세요.</div>
    <div class="login-row"><input id="login-id" autocomplete="username" placeholder="ID" required /><button class="primary-btn" id="login-btn" type="submit">접속</button></div>
    <div id="login-error"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="brand"><div class="logo">MAI</div><div class="subtitle">local personal agent</div></div>
    <div class="header-right">
      <select id="model-select" title="생성 모델 선택"><option value="">모델 로딩 중…</option></select>
      <div class="identity" id="identity"></div><div class="identity" id="connection"></div>
      <button id="logout-btn" type="button">로그아웃</button>
    </div>
  </header>
  <div id="messages"><div id="empty-state"><div class="big">MAI</div><div>메시지를 입력하세요.</div></div></div>
  <div id="input-area">
    <form id="chat-form">
      <div id="upload-status"></div>
      <div id="input-row">
        <label id="upload-btn" title="파일 업로드">＋<input id="file-input" type="file" /></label>
        <textarea id="msg-input" rows="1" placeholder="메시지를 입력하세요..." required></textarea>
        <button id="send-btn" type="submit">전송</button>
      </div>
    </form>
  </div>
</div>

<script>
  const state = { token: sessionStorage.getItem('MAI:auth-token'), userId:null, role:null, sessionId:crypto.randomUUID() };
  const $loginScreen=document.getElementById('login-screen'), $loginForm=document.getElementById('login-form'), $loginId=document.getElementById('login-id'), $loginBtn=document.getElementById('login-btn'), $loginError=document.getElementById('login-error');
  const $app=document.getElementById('app'), $messages=document.getElementById('messages'), $form=document.getElementById('chat-form'), $input=document.getElementById('msg-input'), $send=document.getElementById('send-btn'), $model=document.getElementById('model-select'), $connection=document.getElementById('connection'), $identity=document.getElementById('identity'), $logout=document.getElementById('logout-btn'), $fileInput=document.getElementById('file-input'), $uploadBtn=document.getElementById('upload-btn'), $uploadStatus=document.getElementById('upload-status');

  function authHeaders(extra={}) { return state.token ? {...extra, Authorization:`Bearer ${state.token}`} : extra; }
  function scrollToBottom(behavior='smooth') { requestAnimationFrame(()=>{$messages.scrollTo({top:$messages.scrollHeight,behavior});}); }
  function escapeHtml(value) { return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
  function renderInline(value) {
    let text=escapeHtml(value); text=text.replace(/`([^`]+)`/g,'<code>$1</code>'); text=text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); text=text.replace(/\*([^*]+)\*/g,'<em>$1</em>'); text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'); return text;
  }
  function renderMarkdown(source) {
    const lines=String(source??'').replace(/\r\n/g,'\n').split('\n'), out=[]; let inCode=false, codeLines=[], listType=null, paragraph=[];
    const flush=()=>{if(paragraph.length){out.push(`<p>${paragraph.map(renderInline).join('<br>')}</p>`);paragraph=[];}}; const closeList=()=>{if(listType){out.push(`</${listType}>`);listType=null;}};
    for(const line of lines){
      if(line.startsWith('```')){flush();closeList();if(!inCode){inCode=true;codeLines=[];}else{out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);inCode=false;codeLines=[];}continue;}
      if(inCode){codeLines.push(line);continue;} const heading=line.match(/^(#{1,4})\s+(.+)$/); if(heading){flush();closeList();const level=heading[1].length;out.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);continue;}
      const bullet=line.match(/^\s*[-*]\s+(.+)$/), ordered=line.match(/^\s*\d+\.\s+(.+)$/); if(bullet||ordered){flush();const wanted=bullet?'ul':'ol';if(listType!==wanted){closeList();listType=wanted;out.push(`<${wanted}>`);}out.push(`<li>${renderInline((bullet||ordered)[1])}</li>`);continue;}
      if(line.startsWith('> ')){flush();closeList();out.push(`<blockquote>${renderInline(line.slice(2))}</blockquote>`);continue;} if(!line.trim()){flush();closeList();continue;} paragraph.push(line);
    }
    if(inCode)out.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);flush();closeList();return out.join('');
  }
  function removeEmpty(){const empty=document.getElementById('empty-state');if(empty)empty.remove();}
  function addMessage(role,text){removeEmpty();const row=document.createElement('div');row.className=`msg-row ${role}`;const avatar=document.createElement('div');avatar.className=`avatar ${role}`;avatar.textContent=role==='user'?'U':'MAI';const wrap=document.createElement('div');wrap.className='content-wrap';const bubble=document.createElement('div');bubble.className='bubble';if(role==='user')bubble.textContent=text;else bubble.innerHTML=renderMarkdown(text);wrap.appendChild(bubble);row.append(avatar,wrap);$messages.appendChild(row);scrollToBottom();return{row,wrap,bubble};}
  function addThinking(){const pending=addMessage('mai','');pending.bubble.innerHTML='<div class="loader" aria-label="생각 중"><span></span><span></span><span></span></div>';scrollToBottom();return pending;}
  function renderToolLog(wrap,tools,rounds,model){const diag=document.createElement('div');diag.className='diagnostics';diag.textContent=`${model} · rounds: ${rounds}`;wrap.appendChild(diag);if(!tools.length)return;const details=document.createElement('details');details.className='tool-log';const summary=document.createElement('summary');summary.textContent=`tool log · ${tools.length} call${tools.length===1?'':'s'}`;details.appendChild(summary);tools.forEach(tool=>{const entry=document.createElement('div');entry.className='tool-entry';const head=document.createElement('div');head.className='tool-head';const name=document.createElement('span');name.textContent=tool.name;const status=document.createElement('span');status.textContent=tool.ok?'ok':(tool.error_type||'failed');if(!tool.ok)status.className='tool-failed';head.append(name,status);const args=document.createElement('div');args.className='tool-args';args.textContent=JSON.stringify(tool.arguments,null,2);entry.append(head,args);if(tool.result){const result=document.createElement('div');result.className='tool-result';result.textContent=tool.result;entry.appendChild(result);}details.appendChild(entry);});wrap.appendChild(details);scrollToBottom();}

  async function loadHealth(){const res=await fetch('/health');const data=await res.json();if(!res.ok)throw new Error(data.detail||'health 실패');$connection.textContent=data.tailscale_serve?'Tailscale':'Local';}
  async function loadModels(){const res=await fetch('/models',{headers:authHeaders()});const data=await res.json();if(!res.ok)throw new Error(data.detail||'모델 목록 조회 실패');$model.innerHTML='';data.models.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;option.selected=name===data.current;$model.appendChild(option);});if(!data.models.length)$model.innerHTML='<option value="">설치된 모델 없음</option>';}
  function showApp(){ $loginScreen.style.display='none'; $app.style.display='flex'; $identity.textContent=`${state.userId} · ${state.role}`; Promise.all([loadHealth(),loadModels()]).catch(err=>{$connection.textContent='연결 실패';$connection.title=err.message;}); $input.focus(); }
  function showLogin(message=''){state.token=null;state.userId=null;state.role=null;sessionStorage.removeItem('MAI:auth-token');$app.style.display='none';$loginScreen.style.display='grid';$loginError.textContent=message;$loginId.focus();}
  async function restoreSession(){if(!state.token){showLogin();return;}try{const res=await fetch('/me',{headers:authHeaders()});const data=await res.json();if(!res.ok)throw new Error(data.detail||'세션 만료');state.userId=data.user_id;state.role=data.role;showApp();}catch(err){showLogin(err.message);}}

  $loginForm.addEventListener('submit',async event=>{event.preventDefault();$loginBtn.disabled=true;$loginError.textContent='';try{const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:$loginId.value})});const data=await res.json();if(!res.ok)throw new Error(data.detail||'접속 거부');state.token=data.token;state.userId=data.user_id;state.role=data.role;sessionStorage.setItem('MAI:auth-token',state.token);showApp();}catch(err){$loginError.textContent=err.message;}finally{$loginBtn.disabled=false;}});
  $logout.addEventListener('click',async()=>{try{await fetch('/logout',{method:'POST',headers:authHeaders()});}finally{showLogin();}});
  $fileInput.addEventListener('change',async()=>{const file=$fileInput.files?.[0];if(!file)return;$uploadBtn.classList.add('busy');$uploadStatus.classList.remove('failed');$uploadStatus.textContent=`업로드 중: ${file.name}`;try{const body=new FormData();body.append('file',file,file.name);const res=await fetch('/upload',{method:'POST',headers:authHeaders(),body});const data=await res.json();if(res.status===401){showLogin(data.detail||'세션 만료');return;}if(!res.ok)throw new Error(data.detail||'업로드 실패');const reference=`업로드된 파일: ${data.path}`;$input.value=$input.value.trim()?`${$input.value.trim()}\n${reference}`:reference;$input.dispatchEvent(new Event('input'));$uploadStatus.textContent=`업로드 완료: ${data.filename} (${data.bytes} bytes)`;$input.focus();}catch(err){$uploadStatus.classList.add('failed');$uploadStatus.textContent=`업로드 오류: ${err.message}`;}finally{$fileInput.value='';$uploadBtn.classList.remove('busy');}});
  $form.addEventListener('submit',async event=>{event.preventDefault();const message=$input.value.trim();if(!message)return;addMessage('user',message);$input.value='';$input.style.height='auto';$uploadStatus.textContent='';$uploadStatus.classList.remove('failed');$send.disabled=true;const pending=addThinking();try{const res=await fetch('/chat',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message,session_id:state.sessionId,model:$model.value||null})});const data=await res.json();if(res.status===401){showLogin(data.detail||'세션 만료');return;}if(!res.ok)throw new Error(data.detail||JSON.stringify(data));pending.bubble.innerHTML=renderMarkdown(data.answer);renderToolLog(pending.wrap,data.tools,data.model_rounds,data.model);scrollToBottom();}catch(err){pending.bubble.classList.add('error');pending.bubble.textContent=`오류: ${err.message}`;scrollToBottom();}finally{$send.disabled=false;$input.focus();}});
  $input.addEventListener('input',()=>{$input.style.height='auto';$input.style.height=`${Math.min($input.scrollHeight,150)}px`;});
  $input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$form.requestSubmit();}});
  restoreSession();
</script>
</body>
</html>
