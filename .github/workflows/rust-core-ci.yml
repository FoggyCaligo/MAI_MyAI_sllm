name: Rust Core CI
on:
  push:
    branches: [rewrite/rust-core-20261114]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
        working-directory: rust
      - name: Persist rustfmt on rewrite branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): format core and web adapter"
            git push origin HEAD:rewrite/rust-core-20261114
          fi
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Test
        run: cargo test --workspace
        working-directory: rust
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
