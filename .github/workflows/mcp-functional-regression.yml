name: Native Tool Full Regression
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'mai/mcp_tools/**'
      - 'mai/tools/**'
      - 'mai/remote/**'
      - 'mai/app/server.py'
      - 'mai/app/runtime.py'
      - 'mai/platform/windows.py'
      - 'tests/**'
      - '.github/workflows/mcp-functional-regression.yml'
jobs:
  pytest-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MAI runtime and tests
        run: python -m pip install -e ".[dev]"
      - name: Entire MAI test suite
        run: python -m pytest -q tests
