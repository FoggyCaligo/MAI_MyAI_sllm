name: External Memorizer Integration
on:
  push:
    branches: [feature/mcp-lazy-manager]
  pull_request:
    paths:
      - 'mai/app/runtime.py'
      - 'pyproject.toml'
      - 'tests/test_external_memorizer_integration.py'
jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -c 'from mai.app.server import app; print("MAI server import OK")'
      - run: python -m pytest -q
