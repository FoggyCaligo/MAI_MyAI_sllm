name: Windows MAI EXE Distribution
on:
  workflow_dispatch:
  push:
    branches: [feature/mcp-lazy-manager]
    paths:
      - 'MAI_light_instant_runner/**'
      - '.github/workflows/windows-distribution.yml'
      - 'mai.ps1'
      - '.gitignore'
jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile MAI.exe and assemble tracked source only
        shell: pwsh
        run: ./MAI_light_instant_runner/build.ps1
      - name: Validate distribution tree and protect private data
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'MAI_light_instant_runner/MAI/MAI.exe')) { throw 'No MAI.exe' }
          if (-not (Test-Path -LiteralPath 'MAI_light_instant_runner/MAI/mai.ps1')) { throw 'No entrypoint' }
          if (-not (Test-Path -LiteralPath 'MAI_light_instant_runner/MAI/mai/mcp_tools/mcp_memorizer/server.py')) { throw 'No MCP launcher' }
          if (-not (Test-Path -LiteralPath 'MAI_light_instant_runner/MAI/portable/start-portable-llamacpp-router.ps1')) { throw 'No Portable launcher' }
          if (Test-Path -LiteralPath 'MAI_light_instant_runner/MAI/.env') { throw 'Private env leaked into distribution' }
          $personal = @(Get-ChildItem -Path 'MAI_light_instant_runner/MAI' -Recurse -File | Where-Object { $_.Name -match '\.sqlite3($|[-.])' })
          if ($personal.Count -gt 0) { throw 'Private SQLite data leaked into distribution' }
      - uses: actions/upload-artifact@v4
        with:
          name: MAI-windows-distribution-source-only
          path: MAI_light_instant_runner/MAI/
          if-no-files-found: error
          retention-days: 14
