<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK4</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f12; --surface: #18181f; --border: #2a2a35; --accent: #5ea0ff;
      --accent-dim: #2f4d7a; --text: #e4e4ef; --text-dim: #7e8296; --user-bg: #252538;
      --MK4-bg: #17202d; --danger: #d85b67; --meta: #596178; --radius: 12px;
      --font: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
    #app { display: flex; flex-direction: column; height: 100vh; max-width: 980px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
    .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
    .logo span { color: var(--text-dim); font-size: 13px; font-weight: 400; margin-left: 8px; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .account-chip, #model-select, #logout-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; padding: 7px 12px; font-size: 12px; outline: none; }
    .account-chip { min-width: 84px; text-align: center; } #model-select { max-width: 180px; cursor: pointer; } #logout-btn { cursor: pointer; }
    .login-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(5,5,8,.86); backdrop-filter: blur(8px); }
    .login-overlay.hidden { display: none; }
    .login-modal { width: min(420px,100%); padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    .login-modal h2 { color: var(--accent); margin-bottom: 8px; } .login-modal p { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
    .login-row { display: flex; gap: 8px; }
    #login-id-input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); outline: none; -webkit-text-security: disc; }
    #login-submit { padding: 11px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #07111f; font-weight: 700; cursor: pointer; }
    #login-error { min-height: 20px; margin-top: 10px; color: var(--danger); font-size: 12px; }
    .download-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .download-link { display: inline-flex; align-items: center; min-height: 40px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); text-decoration: none; font-weight: 700; }
    #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    #empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); text-align: center; }
    .msg-row { display: flex; gap: 10px; align-items: flex-start; width: 100%; } .msg-row.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
    .avatar.MK4 { background: var(--accent-dim); color: var(--accent); } .avatar.user { background: var(--user-bg); color: var(--text-dim); font-size: 12px; }
    .bubble { width: fit-content; min-width: 140px; max-width: min(78%,720px); padding: 10px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg-row.user .bubble { background: var(--user-bg); border-top-right-radius: 4px; margin-left: auto; }
    .msg-row.MK4 .bubble { background: var(--MK4-bg); border-top-left-radius: 4px; min-width: 220px; }
    .bubble-text { color: var(--text); white-space: pre-wrap; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 11px; color: var(--meta); }
    .tool-panel { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
    .tool-toggle { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text-dim); border-radius: 999px; padding: 6px 10px; font-size: 11px; cursor: pointer; }
    .tool-log { margin-top: 8px; display: none; gap: 8px; font-size: 11px; color: var(--text-dim); } .tool-log.open { display: grid; }
    .tool-item { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; white-space: pre-wrap; overflow-x: auto; max-height: 180px; }
    #input-area { border-top: 1px solid var(--border); padding: 12px 20px; background: var(--bg); }
    #input-row { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    #msg-input { flex: 1; min-height: 24px; max-height: 140px; resize: none; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: var(--font); }
    #send-btn { background: var(--accent); border: none; color: white; padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #attach-btn { background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--text-dim); width: 34px; height: 34px; border-radius: 8px; font-size: 18px; line-height: 1; cursor: pointer; }
    #attachment-list { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; color: var(--text-dim); font-size: 12px; }
    .attachment-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 9px; }
    .loader { display: flex; gap: 5px; padding: 10px 14px; background: var(--MK4-bg); border-radius: var(--radius); border-top-left-radius: 4px; width: fit-content; min-width: 96px; }
    .loader span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-dim); animation: bounce .9s infinite; }
    .loader span:nth-child(2) { animation-delay: .15s; } .loader span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); background: var(--accent); } }
    @media (max-width:720px) {
      #app { max-width: 100%; } header { flex-direction: column; align-items: stretch; gap: 10px; } .logo { width: 100%; }
      .logo span { display: block; margin-top: 2px; margin-left: 0; } .header-right { width: 100%; justify-content: flex-start; flex-wrap: nowrap; }
      #model-select { flex: 1; min-width: 0; max-width: none; } .account-chip,#logout-btn { flex: 0 0 auto; }
      .bubble { min-width: 0; max-width: calc(100% - 52px); } .msg-row.MK4 .bubble { min-width: 0; }
    }
  </style>
</head>
<body>
<div id="login-overlay" class="login-overlay">
  <form id="login-form" class="login-modal">
    <h2>MK4 로그인</h2>
    <p>허용된 접속 ID를 입력해 주세요. 등록되지 않은 ID와 default-user는 사용할 수 없습니다.</p>
    <div class="login-row"><input id="login-id-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="접속 ID" /><button id="login-submit" type="submit">접속</button></div>
    <div id="login-error"></div>
  </form>
</div>
<div id="app">
  <header><div class="logo">MK4 <span>tool-using graph memory agent</span></div><div class="header-right"><span id="account-chip" class="account-chip">로그인 필요</span><select id="model-select" title="대화 모델 선택"><option value="">모델 로딩 중...</option></select><button id="logout-btn">로그아웃</button></div></header>
  <div id="messages"><div id="empty-state"><div style="font-size:36px;color:var(--accent);font-weight:700;">MK4</div><div>로그인하면 선택한 sLLM이 기억, 검색, 파일, 문서, 이미지와 터미널 도구를 사용할 수 있습니다.</div></div></div>
  <div id="input-area"><div id="attachment-list"></div><div id="input-row"><textarea id="msg-input" rows="1" placeholder="메시지를 입력하세요..."></textarea><input id="file-input" type="file" multiple hidden /><button id="attach-btn" type="button" title="파일 첨부">📎</button><button id="send-btn">전송</button></div></div>
</div>
<script>
  const state={loading:false,attachments:[],authenticated:false,role:null};
  const $messages=document.getElementById("messages"),$emptyState=document.getElementById("empty-state"),$modelSelect=document.getElementById("model-select"),$accountChip=document.getElementById("account-chip"),$msgInput=document.getElementById("msg-input"),$sendBtn=document.getElementById("send-btn"),$attachBtn=document.getElementById("attach-btn"),$fileInput=document.getElementById("file-input"),$attachmentList=document.getElementById("attachment-list"),$logoutBtn=document.getElementById("logout-btn"),$loginOverlay=document.getElementById("login-overlay"),$loginForm=document.getElementById("login-form"),$loginIdInput=document.getElementById("login-id-input"),$loginError=document.getElementById("login-error");
  async function loadModels(){try{const res=await fetch("/models"),data=await res.json(),models=data.models||[],current=data.current||"";$modelSelect.innerHTML="";if(!models.length){$modelSelect.innerHTML='<option value="">모델 없음</option>';return;}models.forEach(name=>{const opt=document.createElement("option");opt.value=name;opt.textContent=name;if(name===current)opt.selected=true;$modelSelect.appendChild(opt);});}catch(_){$modelSelect.innerHTML='<option value="">연결 실패</option>';}}
  initializeAuth();
  async function initializeAuth(){try{const res=await fetch("/auth/status");if(!res.ok)throw new Error("login_required");const data=await res.json();setAuthenticated(data.role);await loadModels();}catch(_){showLogin();}}
  function setAuthenticated(role){state.authenticated=true;state.role=role;$accountChip.textContent=role==="owner"?"소유자":"체험판";$attachBtn.disabled=role==="trial";$attachBtn.title=role==="trial"?"파일 첨부는 소유자만 사용할 수 있습니다":"파일 첨부";$loginOverlay.classList.add("hidden");$loginIdInput.value="";$loginError.textContent="";}
  function showLogin(message=""){state.authenticated=false;state.role=null;$attachBtn.disabled=true;$accountChip.textContent="로그인 필요";$loginError.textContent=message;$loginOverlay.classList.remove("hidden");setTimeout(()=>$loginIdInput.focus(),0);}
  $loginForm.addEventListener("submit",async event=>{event.preventDefault();const loginId=$loginIdInput.value.trim();if(!loginId){$loginError.textContent="접속 ID를 입력해 주세요.";return;}try{const res=await fetch("/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login_id:loginId})});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.message||"로그인 실패");setAuthenticated(data.role);await loadModels();$msgInput.focus();}catch(err){showLogin(err.message||"로그인 실패");}});
  $logoutBtn.addEventListener("click",async()=>{try{await fetch("/auth/logout",{method:"POST"});}catch(_){}showLogin("로그아웃했습니다.");});
  $msgInput.addEventListener("input",()=>{$msgInput.style.height="auto";$msgInput.style.height=Math.min($msgInput.scrollHeight,140)+"px";});
  $sendBtn.addEventListener("click",sendMessage);$attachBtn.addEventListener("click",()=>$fileInput.click());$fileInput.addEventListener("change",()=>{state.attachments=Array.from($fileInput.files||[]);renderAttachments();});$msgInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
  async function sendMessage(){if(state.loading)return;if(!state.authenticated){showLogin("허용된 접속 ID를 입력해 주세요.");return;}const rawMessage=$msgInput.value.trim();if(!rawMessage&&!state.attachments.length)return;$emptyState.style.display="none";const pending=state.attachments.map(f=>f.name);appendUserBubble(state.role==="owner"?"소유자":"체험판",rawMessage||"(첨부 파일)",pending);$msgInput.value="";$msgInput.style.height="auto";const loader=appendLoader();state.loading=true;$sendBtn.disabled=true;try{const uploaded=[];for(const file of state.attachments)uploaded.push(await uploadAttachment(file));const attachmentText=uploaded.length?"\n\n[첨부 파일]\n다음은 MK4 서버에 업로드된 파일 경로입니다. 원본 로컬 경로를 추측하지 말고 아래 경로를 도구로 읽어주세요.\n"+uploaded.map(item=>`- ${item.filename}: ${item.path}`).join("\n"):"";const message=(rawMessage||"첨부 파일을 확인해줘.")+attachmentText;const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,model:$modelSelect.value||null})});const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{};}catch(_){data={detail:raw||res.statusText};}if(res.status===401){showLogin(data.message||"다시 로그인해 주세요.");throw new Error(data.message||"로그인이 필요합니다.");}if(!res.ok)throw new Error(data.detail||res.statusText);loader.remove();appendAssistantBubble(data);clearAttachments();}catch(err){loader.remove();appendErrorBubble(err.message||String(err));}finally{state.loading=false;$sendBtn.disabled=false;$msgInput.focus();}}
  async function uploadAttachment(file){const form=new FormData();form.append("file",file);const res=await fetch("/upload",{method:"POST",body:form});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data.detail||data.message||"파일 업로드 실패");return data;}
  function renderAttachments(){if(!state.attachments.length){$attachmentList.style.display="none";$attachmentList.innerHTML="";return;}$attachmentList.style.display="flex";$attachmentList.innerHTML=state.attachments.map(file=>`<span class="attachment-chip">📎 ${escapeHtml(file.name)}</span>`).join("");}
  function clearAttachments(){state.attachments=[];$fileInput.value="";renderAttachments();}
  function appendUserBubble(userId,text,attachmentNames=[]){const attachmentHtml=attachmentNames.length?`<div class="meta">${attachmentNames.map(name=>`<span>📎 ${escapeHtml(name)}</span>`).join("")}</div>`:"";const row=document.createElement("div");row.className="msg-row user";row.innerHTML=`<div class="avatar user">YOU</div><div class="bubble"><div class="bubble-text">${escapeHtml(text)}</div><div class="meta"><span>USER_ID ${escapeHtml(userId)}</span></div>${attachmentHtml}</div>`;$messages.appendChild(row);scrollBottom();}
  function appendAssistantBubble(data){const row=document.createElement("div");row.className="msg-row MK4";const events=Array.isArray(data.tool_events)?data.tool_events:[];const panel=events.length?`<div class="tool-panel"><button class="tool-toggle" type="button">툴 로그 ${events.length}개 보기</button><div class="tool-log">${events.map((event,idx)=>`<div class="tool-item">#${idx+1}\ntool: ${escapeHtml(event.tool)}\nargs: ${escapeHtml(JSON.stringify(event.arguments,null,2))}\nresult: ${escapeHtml(JSON.stringify(event.result,null,2))}</div>`).join("")}</div></div>`:"";row.innerHTML=`<div class="avatar MK4">MK5</div><div class="bubble"><div class="bubble-text">${window.MK4Markdown?window.MK4Markdown.render(data.text||"(응답 없음)"):escapeHtml(data.text||"(응답 없음)")}</div><div class="meta"><span>tools ${escapeHtml(String((data.used_tools||[]).length))}</span><span>writes ${escapeHtml(String((data.memory_writes||[]).length))}</span></div>${panel}</div>`;const toggle=row.querySelector(".tool-toggle"),log=row.querySelector(".tool-log");if(toggle&&log)toggle.addEventListener("click",()=>{const open=log.classList.toggle("open");toggle.textContent=open?`툴 로그 ${events.length}개 접기`:`툴 로그 ${events.length}개 보기`;});$messages.appendChild(row);scrollBottom();}
  function appendErrorBubble(message){const row=document.createElement("div");row.className="msg-row MK4";row.innerHTML=`<div class="avatar MK4">MK5</div><div class="bubble" style="color:var(--danger)">[오류] ${escapeHtml(message)}</div>`;$messages.appendChild(row);scrollBottom();}
  function appendLoader(){const row=document.createElement("div");row.className="msg-row MK4 loader-row";row.innerHTML='<div class="avatar MK4">MK5</div><div class="loader"><span></span><span></span><span></span></div>';$messages.appendChild(row);scrollBottom();return row;}
  function scrollBottom(){$messages.scrollTop=$messages.scrollHeight;}function escapeHtml(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
</script>
</body>
</html>
